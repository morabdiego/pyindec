[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyindec"
version = "0.1.0"
description = "Cliente oficial-friendly en Python para el Catálogo API-INDEC (Instituto Nacional de Estadística y Censos de la República Argentina)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Diego Morabito", email = "morabdiego@gmail.com" },
]
keywords = [
    "indec",
    "argentina",
    "estadisticas",
    "datos-abiertos",
    "ipc",
    "inflacion",
    "emae",
    "eph",
    "pobreza",
    "comercio-exterior",
    "censo",
    "api-client",
    "postgrest",
    "pandas",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Documentation = "https://api.indec.gob.ar/docs"
Homepage = "https://github.com/morabdiego/pyindec"
Repository = "https://github.com/morabdiego/pyindec"
Issues = "https://github.com/morabdiego/pyindec/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pyindec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
